[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idamcp"
version = "0.1.0"
description = "IDA Pro MCP Server with gateway proxy and embedded relational SQLite query engine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi==0.143.3",
  "fastmcp[code-mode]==4.1.2",
  "keystone-engine==0.9.2",
  "sqlglotc==30.23.0",
  "tomli_w==1.2.0",
  "watchdog==6.0.0",
]

[project.optional-dependencies]
dev = [
  "pyink",
  "pytest",
]

[project.scripts]
idamcp-headless = "ida_mcp.headless:main"
idamcp-dashboard = "frontend.security_dashboard:main"
idamcp-generate-proxy = "generators.generate_proxy:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "ida_mcp*",
  "gateway*",
  "shared*",
  "frontend*",
  "generators*",
  "plugins*",
]

[tool.setuptools.package-data]
frontend = ["index.html"]

[tool.pyink]
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
